<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>English Daily Reps</title>
<style>html,body{margin:0;height:100%;background:#F4F6FB;color:#646C87;font:14px "Malgun Gothic",system-ui,sans-serif;display:grid;place-items:center}
@media (prefers-color-scheme: dark){html,body{background:#0E1222;color:#9AA2BF}}</style>
</head>
<body>
<p>English Daily Reps 여는 중…</p>
<script>
/* PC 바로가기가 여는 페이지. 항상 온라인 최신 버전으로 보낸다 (설치 없이 자동 업데이트).
   처음 한 번은 예전 '내 컴퓨터 파일' 버전에 쌓인 학습 기록을 함께 넘겨준다. */
var APP = "https://leess1987-alt.github.io/english-daily-reps/";
var url = APP + "#home";
try {
  if (!localStorage.getItem("edr-moved")) {
    var d = localStorage.getItem("edr-v2");
    if (d) url = APP + "#import=" + encodeURIComponent(btoa(unescape(encodeURIComponent(d))));
    localStorage.setItem("edr-moved", new Date().toISOString());
  }
} catch (e) {}
location.replace(url);
</script>
</body>
</html>
