<title>English Daily Reps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap">
<style>
/* Layout: phone-first app column (max 520px) — home dashboard, guided lesson flow with sticky CTA + slide-up feedback sheet, bottom tab bar */
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --surface-2:#EEF1F8; --ink:#141A33; --muted:#646C87; --line:#E2E6F0;
  --accent:#3352F5; --accent-2:#2440D8; --on-accent:#FFFFFF; --sun:#FFD54A; --sun-ink:#141A33;
  --good:#12A066; --good-bg:#E2F6EC; --bad:#E5484D; --bad-bg:#FDE8E8; --warn:#D98200;
  --t-word:#3352F5; --b-word:#E6EBFF; --t-listen:#0B968F; --b-listen:#DAF3F1;
  --t-write:#7446DB; --b-write:#EEE7FC; --t-speak:#EC5B37; --b-speak:#FDE8E1;
  --t-gram:#C77C00; --b-gram:#FFF1D3;
  --shadow:0 1px 2px rgba(20,26,51,.06),0 8px 24px rgba(20,26,51,.06);
  --f-ui:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-en:"Literata",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1222; --surface:#171C30; --surface-2:#20263F; --ink:#ECEFF8; --muted:#9AA2BF; --line:#2A3150;
  --accent:#6F86FF; --accent-2:#8A9CFF; --on-accent:#0B1030; --sun:#F2C94C; --sun-ink:#141A33;
  --good:#3FCF8E; --good-bg:#12302A; --bad:#FF6B6F; --bad-bg:#3A1C22; --warn:#F2B04A;
  --t-word:#8399FF; --b-word:#1F2850; --t-listen:#3FD1C8; --b-listen:#11302F;
  --t-write:#A98BFF; --b-write:#2A2150; --t-speak:#FF8B6B; --b-speak:#3A2220;
  --t-gram:#F2B04A; --b-gram:#3A2C12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1222; --surface:#171C30; --surface-2:#20263F; --ink:#ECEFF8; --muted:#9AA2BF; --line:#2A3150;
  --accent:#6F86FF; --accent-2:#8A9CFF; --on-accent:#0B1030; --sun:#F2C94C; --sun-ink:#141A33;
  --good:#3FCF8E; --good-bg:#12302A; --bad:#FF6B6F; --bad-bg:#3A1C22; --warn:#F2B04A;
  --t-word:#8399FF; --b-word:#1F2850; --t-listen:#3FD1C8; --b-listen:#11302F;
  --t-write:#A98BFF; --b-write:#2A2150; --t-speak:#FF8B6B; --b-speak:#3A2220;
  --t-gram:#F2B04A; --b-gram:#3A2C12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
#app{max-width:520px;margin:0 auto;padding-block:20px 112px;display:grid;gap:16px}
#app.in-session{padding-bottom:150px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.en{font-family:var(--f-en);font-weight:500;letter-spacing:-.005em}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:14px;font-weight:700;font-size:16px;background:var(--surface-2);color:var(--ink);transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 4px 0 var(--accent-2)}
.btn.primary:active{box-shadow:0 1px 0 var(--accent-2);transform:translateY(3px)}
.btn.primary:disabled{background:var(--line);color:var(--muted);box-shadow:none;cursor:default}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--surface-2)}

/* cards */
.card{background:var(--surface);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.label{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em}

/* home header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.homeview > *,.stage > *,#app > *{min-width:0}
.top h1{font-size:22px;font-weight:900;letter-spacing:-.02em}
.top h1 small{display:block;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.pills{display:flex;gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 12px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.pill .flame{color:#FF7A1A}
.pill .gem{color:var(--accent)}

/* hero */
.hero{background:var(--accent);color:var(--on-accent);border-radius:24px;padding:22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:var(--on-accent);opacity:.07}
.hero h2{font-size:22px;font-weight:900;line-height:1.3}
.hero p{opacity:.85;font-size:14px;margin-top:4px}
.hero .btn{grid-column:1/-1;background:var(--on-accent);color:var(--accent);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.ring{width:84px;height:84px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:20px;font-variant-numeric:tabular-nums}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.wd{display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--muted)}
.wd i{width:min(30px,8vw);height:min(30px,8vw);border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-style:normal}
.wd.on i{background:#FF7A1A;color:#fff}
.wd.today b{color:var(--ink)}

/* mode tiles */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:grid;gap:10px;text-align:left;transition:transform .1s}
.mode:active{transform:scale(.98)}
.mode .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.mode h3{font-size:16px;font-weight:700}
.mode p{font-size:13px;color:var(--muted)}
.mode.wide{grid-column:1/-1;grid-template-columns:auto minmax(0,1fr) auto;align-items:center}
.t-word .ic{background:var(--b-word);color:var(--t-word)}
.t-listen .ic{background:var(--b-listen);color:var(--t-listen)}
.t-write .ic{background:var(--b-write);color:var(--t-write)}
.t-speak .ic{background:var(--b-speak);color:var(--t-speak)}
.t-gram .ic{background:var(--b-gram);color:var(--t-gram)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px}
.sec h2{font-size:18px;font-weight:900}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:36px;padding:0 14px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tip{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.tip .ic{width:40px;height:40px;border-radius:12px;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center}
.tip b{display:block;margin-bottom:2px}
.tip p{font-size:14px;color:var(--muted)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav a{display:grid;justify-items:center;gap:2px;padding:6px 0;color:var(--muted);text-decoration:none;font-size:11px;font-weight:700;border-radius:12px}
.nav a[aria-current="page"]{color:var(--accent)}
.nav a.mic{color:var(--on-accent)}
.nav a.mic span.b{width:52px;height:52px;margin-top:-22px;border-radius:50%;background:var(--t-speak);display:grid;place-items:center;box-shadow:0 6px 16px rgba(236,91,55,.35)}
.nav a.mic em{font-style:normal;color:var(--muted)}

/* session */
.sbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding-block:8px}
.prog{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;border-radius:999px;background:var(--good);transition:width .35s cubic-bezier(.2,.8,.2,1)}
.xpchip{font-weight:900;font-size:14px;color:var(--warn);font-variant-numeric:tabular-nums}
.kind{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px}
.kind.t-word{background:var(--b-word);color:var(--t-word)}
.kind.t-listen{background:var(--b-listen);color:var(--t-listen)}
.kind.t-write{background:var(--b-write);color:var(--t-write)}
.kind.t-speak{background:var(--b-speak);color:var(--t-speak)}
.kind.t-gram{background:var(--b-gram);color:var(--t-gram)}
.kind svg.i{width:16px;height:16px}
.q{font-size:22px;font-weight:900;line-height:1.35;letter-spacing:-.01em}
.stage{display:grid;gap:18px}

.cta{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cta .in{max-width:520px;margin:0 auto;display:flex;gap:10px}
.cta .in > *{flex:1}

/* feedback sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-radius:24px 24px 0 0}
.sheet.show{transform:none}
.sheet .in{max-width:520px;margin:0 auto;display:grid;gap:12px}
.sheet h3{font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px}
.sheet .body{font-size:15px}
.sheet .body .en{font-size:18px}
.sheet.ok{background:var(--good-bg);color:var(--ink)}
.sheet.ok h3{color:var(--good)}
.sheet.ok .btn{background:var(--good);color:var(--surface);box-shadow:0 4px 0 color-mix(in srgb,var(--good) 70%,#000)}
.sheet.no{background:var(--bad-bg);color:var(--ink)}
.sheet.no h3{color:var(--bad)}
.sheet.no .btn{background:var(--bad);color:var(--surface);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 70%,#000)}

/* word card */
.flash{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:28px 20px;display:grid;justify-items:center;gap:10px;text-align:center;min-height:300px;align-content:center}
.flash .w{font-family:var(--f-en);font-weight:600;font-size:clamp(38px,11vw,54px);line-height:1.1;letter-spacing:-.01em}
.flash .ipa{color:var(--muted);font-size:15px}
.flash .mean{font-size:22px;font-weight:900;margin-top:6px}
.flash .ex{background:var(--surface-2);border-radius:14px;padding:12px 14px;display:grid;gap:2px;width:100%;text-align:left}
.flash .ex .en{font-size:18px}
.flash .ex .ko{font-size:14px;color:var(--muted)}
.say{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;background:var(--b-word);color:var(--t-word);font-weight:700;font-size:14px}
.say.big{width:96px;height:96px;padding:0;border-radius:28px;justify-content:center;background:var(--t-listen);color:#fff;box-shadow:0 6px 0 color-mix(in srgb,var(--t-listen) 65%,#000)}
.say.big svg.i{width:40px;height:40px}
.say.slow{background:var(--b-listen);color:var(--t-listen)}

/* block builder */
.answer{min-height:112px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding-bottom:12px;
  background:repeating-linear-gradient(transparent 0 54px,var(--line) 54px 56px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.blk{font-family:var(--f-en);font-weight:500;font-size:18px;height:46px;padding:0 14px;border-radius:12px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);transition:transform .08s}
.blk:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.blk.used{visibility:hidden}
.ko-big{font-size:21px;font-weight:700;background:var(--surface);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}

/* grammar */
.pattern{background:var(--b-gram);border-radius:18px;padding:16px;display:grid;gap:6px}
.pattern .f{font-weight:900;color:var(--t-gram);font-size:17px}
.pattern .en{font-size:18px}
.opts{display:grid;gap:10px}
.opt{min-height:56px;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-family:var(--f-en);font-size:19px;font-weight:500}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--b-word);color:var(--accent);box-shadow:0 3px 0 var(--accent)}
.fill{font-family:var(--f-en);font-size:24px;font-weight:500;line-height:1.5}
.fill .gap{display:inline-block;min-width:96px;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent)}

/* speaking */
.target{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:22px;display:grid;gap:10px}
.target .en{font-size:clamp(23px,6.4vw,28px);line-height:1.4}
.words{display:flex;flex-wrap:wrap;gap:6px 8px;font-family:var(--f-en);font-size:clamp(23px,6.4vw,28px);font-weight:500;line-height:1.35}
.words span{transition:color .15s;border-radius:6px}
.words .ok{color:var(--good)}
.words .near{color:var(--warn)}
.words .miss{color:var(--bad);text-decoration:underline wavy;text-underline-offset:5px;text-decoration-thickness:2px}
.words .wait{color:var(--ink)}
.micwrap{display:grid;justify-items:center;gap:12px;padding-block:6px}
.micbtn{width:96px;height:96px;border-radius:50%;background:var(--t-speak);color:#fff;display:grid;place-items:center;position:relative;box-shadow:0 8px 22px rgba(236,91,55,.35);transition:transform .12s}
.micbtn svg.i{width:40px;height:40px}
.micbtn:active{transform:scale(.95)}
.micbtn.live::before,.micbtn.live::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--t-speak);animation:ripple 1.4s ease-out infinite}
.micbtn.live::after{animation-delay:.7s}
@keyframes ripple{from{transform:scale(1);opacity:.7}to{transform:scale(1.6);opacity:0}}
.eq{display:flex;gap:4px;height:22px;align-items:center}
.eq i{width:4px;border-radius:2px;background:var(--t-speak);height:6px}
.live-on .eq i{animation:eq .8s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.1s}.eq i:nth-child(3){animation-delay:.2s}.eq i:nth-child(4){animation-delay:.3s}.eq i:nth-child(5){animation-delay:.4s}
@keyframes eq{50%{height:22px}}
.micbtn.busy{background:var(--surface-2);box-shadow:none}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--t-speak);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.eq i{transition:height .08s}
.mstate{font-weight:700;color:var(--muted);font-size:14px;min-height:22px;text-align:center}
.heard{font-size:14px;color:var(--muted);text-align:center;min-height:21px}
.gauge{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.gauge .ring{width:92px;height:92px}
.gauge .v{font-size:24px}
.gauge h3{font-size:20px;font-weight:900}
.subbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* finish */
.finish{display:grid;justify-items:center;text-align:center;gap:14px;padding-top:30px}
.medal{width:120px;height:120px;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;box-shadow:0 8px 0 color-mix(in srgb,var(--sun) 65%,#000)}
.medal svg.i{width:60px;height:60px;stroke-width:2.4}
.finish h2{font-size:28px;font-weight:900}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.stat{background:var(--surface);border-radius:18px;padding:14px 8px;box-shadow:var(--shadow);display:grid;gap:2px}
.stat b{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}

/* stats page */
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:140px;margin-top:14px}
.bars div{display:grid;gap:6px;justify-items:center;align-content:end;height:100%}
.bars i{display:block;width:100%;max-width:28px;border-radius:8px 8px 4px 4px;background:var(--accent);min-height:4px}
.bars i.zero{background:var(--surface-2)}
.bars span{font-size:12px;color:var(--muted);font-weight:700}
.bars em{font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.mastery{display:grid;gap:10px;margin-top:12px}
.mrow{display:grid;grid-template-columns:76px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:14px}
.mrow .track{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.mrow .track i{display:block;height:100%;border-radius:999px}
.mrow b{text-align:right;font-variant-numeric:tabular-nums}
.lvl{display:grid;gap:8px}
.lvl .track{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.lvl .track i{display:block;height:100%;background:var(--sun);border-radius:999px}

/* settings */
.set{display:grid;gap:14px}
.set label{display:grid;gap:6px;font-weight:700;font-size:14px}
select{font:inherit;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px}
input[type=range]{width:100%;accent-color:var(--accent)}
.switch{display:grid!important;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.switch span{display:grid;gap:2px}
.switch small{font-weight:400;color:var(--muted);font-size:13px;line-height:1.45}
.switch input{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked{background:var(--good)}
.switch input:checked::after{transform:translateX(22px)}
.warnbox{background:var(--bad-bg);border-radius:16px;padding:14px 16px;font-size:14px;display:grid;gap:4px}
.warnbox b{color:var(--bad)}
ol.how{margin:6px 0 0;padding-left:20px;display:grid;gap:4px;font-size:14px;color:var(--muted)}

function pickSent(not=[]){const p=SENTS.map((s,i)=>i).filter(i=>inTopic(SENTS[i][2])&&!not.includes(i));const all=p.length?p:SENTS.map((s,i)=>i);return all[Math.floor(Math.random()*all.length)]}
function sentItems(type,n){const used=[];return Array.from({length:n},()=>{const i=pickSent(used);used.push(i);return{type,i}})}
function gramItems(n){const start=Object.values(S.log).reduce((a,l)=>a+(l.patterns||0),0)%PATTERNS.length;return Array.from({length:n},(_,k)=>({type:"gram",i:(start+k)%PATTERNS.length}))}
function startSession(mode,type){
  let items;
  if(mode==="lesson")items=[...wordQueue(3).map(i=>({type:"word",i})),...sentItems("listen",2),...sentItems("write",2),...sentItems("speak",3),...gramItems(2)];
  else if(type==="word")items=wordQueue(10).map(i=>({type:"word",i}));
  else if(type==="gram")items=gramItems(6);
  else items=sentItems(type,type==="speak"?5:6);
  cur={mode,type,items,i:0,st:{},correct:0,xp:0};clearRec();
  /* 말하기 탭(#speak)에서 들어오면 기록을 바꿔치기해서, 뒤로 가기가 세션을 다시 시작하지 않게 */
  if(location.hash==="#speak"){history.replaceState(null,"","#session");render()}
  else if(location.hash!=="#session")location.hash="session";else render()}
function endSession(){stopListening();clearRec();hush();cur=null;hideSheet()}
function award(kind,ok){const g=ok?10:3;cur.xp+=g;S.xp=(S.xp||0)+g;if(ok)cur.correct++;dayLog()[KINDS[kind].log]++;save()}
function next(){hideSheet();stopListening();clearRec();hush();cur.i++;cur.st={};
  if(cur.i>=cur.items.length){if(cur.mode==="lesson"){cur.xp+=30;S.xp+=30;dayLog().lesson=true;save()}cur.finished=true}
  render();window.scrollTo(0,0)}

/* sheet & cta */
function setCTA(html){const c=$("#cta");if(!html){c.hidden=true;return}c.hidden=false;$("#ctaIn").innerHTML=html}
function showSheet(ok,title,body,btn="계속하기"){const s=$("#sheet");s.className="sheet "+(ok?"ok":"no")+" show";
  $("#sheetIn").innerHTML=`<h3>${ico(ok?I.check:I.x)}${title}</h3>${body?`<div class="body">${body}</div>`:""}<button class="btn block" id="sheetNext">${btn}</button>`;
  $("#sheetNext").onclick=next;setTimeout(()=>{const b=$("#sheetNext");if(b)b.focus()},50)}
function hideSheet(){$("#sheet").className="sheet"}

/* ================= EXERCISES ================= */
const EX={};
EX.word={
  html(it,st){const w=WORDS[it.i];return `<div class="flash">
    <span class="kind t-word">${ico(KINDS.word.icon)}${w[1]} · ${w[6]}</span>
    <div class="w">${esc(w[0])}</div><div class="ipa">/${w[2]}/</div>
    <button class="say" id="sayW">${ico(I.play)}발음 듣기</button>
    ${st.flip?`<div class="mean">${esc(w[3])}</div><div class="ex"><span class="en">${esc(w[4])}</span><span class="ko">${esc(w[5])}</span></div>
      <button class="say" id="sayE">${ico(I.play)}예문 듣기</button>`:""}
  </div>`},
  bind(it,st){const w=WORDS[it.i];$("#sayW").onclick=()=>speak(w[0]);if($("#sayE"))$("#sayE").onclick=()=>speak(w[4]);
    if(!st.spoke){st.spoke=1;speak(w[0])}
    if(!st.flip)setCTA(`<button class="btn primary" id="flipB">뜻 확인하기</button>`),$("#flipB").onclick=()=>{st.flip=1;render();speak(w[4])};
    else{setCTA(`<button class="btn ghost" id="noB">몰랐어요</button><button class="btn primary" id="yesB">알았어요</button>`);
      const go=k=>{grade(it.i,k);award("word",k);next()};$("#noB").onclick=()=>go(false);$("#yesB").onclick=()=>go(true)}}
};
function distractors(en,n=2){const own=new Set(tok(en));const pool=shuffle(SENTS.flatMap(s=>rawWords(s[0]))).filter(w=>!own.has(w.toLowerCase().replace(/[’']/g,"'")));
  const out=[];for(const w of pool){if(!out.some(o=>o.toLowerCase()===w.toLowerCase()))out.push(w);if(out.length>=n)break}return out}
function builder(kind){return{
  html(it,st){const [en,ko]=SENTS[it.i];if(!st.bank){st.bank=shuffle(rawWords(en).concat(distractors(en)));st.ans=[]}
    const head=kind==="listen"?`<p class="q">들리는 문장을 순서대로 맞춰 보세요</p>
      <div class="row" style="display:flex;gap:14px;align-items:center;justify-content:center;padding-block:4px">
      <button class="say big" id="pl" aria-label="듣기">${ico(I.play)}</button><button class="say slow" id="ps">${ico(I.turtle)}천천히</button></div>`
      :`<p class="q">영어로 바꿔 보세요</p><div class="ko-big">${esc(ko)}</div>`;
    return `<span class="kind ${KINDS[kind].cls}">${ico(KINDS[kind].icon)}${KINDS[kind].name}</span>${head}
    <div class="answer" id="ans">${st.ans.map((k,p)=>`<button class="blk" data-rm="${p}">${esc(st.bank[k])}</button>`).join("")}</div>
    <div class="bank">${st.bank.map((w,k)=>`<button class="blk ${st.ans.includes(k)?"used":""}" data-add="${k}" ${st.ans.includes(k)||st.checked?"disabled":""}>${esc(w)}</button>`).join("")}</div>`},
  bind(it,st){const [en,ko]=SENTS[it.i];
    if(kind==="listen"){$("#pl").onclick=()=>speak(en);$("#ps").onclick=()=>speak(en,.7);if(!st.spoke){st.spoke=1;speak(en)}}
    document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{if(st.checked)return;st.ans.push(+b.dataset.add);speak(st.bank[+b.dataset.add],1.1);render()});
    document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{if(st.checked)return;st.ans.splice(+b.dataset.rm,1);render()});
    setCTA(`<button class="btn primary" id="chk" ${st.ans.length?"":"disabled"}>확인</button>`);
    $("#chk").onclick=()=>{st.checked=1;const mine=st.ans.map(k=>st.bank[k]).join(" ");
      const ok=tok(mine).join(" ")===tok(en).join(" ");award(kind,ok);speak(en);
      showSheet(ok,ok?pick(["정답이에요!","완벽해요!","좋아요!"]):"정답은 이거예요",`<span class="en">${esc(en)}</span>${kind==="listen"?`<br><span class="muted">${esc(ko)}</span>`:""}`)}}
}}
const pick=a=>a[Math.floor(Math.random()*a.length)];
EX.listen=builder("listen");EX.write=builder("write");

EX.gram={
  html(it,st){const p=PATTERNS[it.i];if(!st.opts)st.opts=shuffle(p.q.slice(1));const [qs,ans]=p.q;
    return `<span class="kind t-gram">${ico(KINDS.gram.icon)}기초 문법 ${it.i+1}/${PATTERNS.length}</span>
    <div class="pattern"><span class="f">${esc(p.form)}</span><span>${esc(p.ko)}</span>
      <span><span class="en">${esc(p.ex[0])}</span> <button class="say" id="pex" style="height:32px;vertical-align:middle;background:var(--surface)">${ico(I.play)}</button></span><span class="muted" style="font-size:14px">${esc(p.ex[1])}</span></div>
    <p class="q">빈칸에 알맞은 말은?</p>
    <div class="fill">${esc(qs).replace("___",`<span class="gap">${st.sel!=null?esc(st.sel):"&nbsp;"}</span>`)}</div>
    <div class="opts">${st.opts.map(o=>`<button class="opt" data-o="${esc(o)}" aria-pressed="${st.sel===o}" ${st.checked?"disabled":""}>${esc(o)}</button>`).join("")}</div>`},
  bind(it,st){const p=PATTERNS[it.i];$("#pex").onclick=()=>speak(p.ex[0]);
    document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{st.sel=b.dataset.o;render()});
    setCTA(`<button class="btn primary" id="chk" ${st.sel!=null?"":"disabled"}>확인</button>`);
    $("#chk").onclick=()=>{st.checked=1;const ok=st.sel===p.q[1];award("gram",ok);const full=p.q[0].replace("___",p.q[1]);speak(full);render();
      showSheet(ok,ok?"정답이에요!":"정답: "+esc(p.q[1]),`<span class="en">${esc(full)}</span><br><span class="muted">${esc(p.why)}</span>`)}}
};

EX.speak={
  html(it,st){const [en,ko]=SENTS[it.i];const r=st.res;
    const words=r?r.words.map((w,k)=>`<span class="${st.live&&r.marks[k]==="miss"?"wait":r.marks[k]}">${esc(w)}</span>`).join(""):"";
    return `<span class="kind t-speak">${ico(KINDS.speak.icon)}따라 말하기</span>
    <p class="q">듣고 따라 말해 보세요</p>
    <div class="target">
      ${r?`<div class="words" id="liveWords">${words}</div>`:`<div class="en" id="liveWords">${esc(en)}</div>`}
      <span class="muted" style="font-size:15px">${esc(ko)}</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="say" id="sp">${ico(I.play)}듣기</button><button class="say" id="sps">${ico(I.turtle)}천천히</button></div>
    </div>
    ${st.final?`<div class="card gauge"><div class="ring">${ringSVG(r.pct/100,gradeOf(r.pct)[1],"var(--surface-2)",92,10)}<span class="v">${r.pct}</span></div>
      <div><h3 style="color:${gradeOf(r.pct)[1]}">${gradeOf(r.pct)[0]}</h3><p class="muted" style="font-size:14px">${gradeOf(r.pct)[2]}</p></div></div>`:""}
    <div class="micwrap ${st.live&&!useAI()?"live-on":""}">
      <div class="eq" id="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <button class="micbtn ${st.live?"live":""} ${st.busy?"busy":""}" id="micB" ${st.busy?"disabled":""} aria-label="${st.live?(useAI()?"말 끝내고 채점하기":"채점 멈추기"):"말하기 시작"}">${st.busy?'<span class="spin"></span>':ico(KINDS.speak.icon)}</button>
      <div class="mstate" id="mstate">${st.msg||(st.final?"다시 하려면 마이크를 누르세요":"마이크를 누르고 문장을 말하세요")}</div>
      <div class="heard" id="heard">${st.res&&st.res.heard?"인식: “"+esc(st.res.heard)+"”":""}</div>
    </div>
    <div class="subbar">${useAI()?`<button class="btn sm ghost" id="mineB" ${myUrl?"":"disabled"}>${ico(I.play)}내 목소리</button>`
      :`<button class="btn sm ghost" id="recB">${ico(I.rec)}${recording()?"녹음 멈추기":myUrl?"다시 녹음":"녹음하기"}</button>`}
      <button class="btn sm ghost" id="abB" ${myUrl?"":"disabled"}>${ico(I.ear)}원어민 → 나</button></div>`},
  bind(it,st){const en=SENTS[it.i][0];
    $("#sp").onclick=()=>speak(en);$("#sps").onclick=()=>speak(en,.7);
    if(!st.spoke){st.spoke=1;speak(en)}
    if($("#recB"))$("#recB").onclick=()=>toggleRec(()=>render());if($("#mineB"))$("#mineB").onclick=playMine;
    $("#abB").onclick=()=>speak(en,1,()=>setTimeout(playMine,300));
    const ai=useAI();
    /* AI 모드: 이 화면에 들어오면 모델을 미리 받기 시작 */
    if(ai&&!asrReady&&!st.live&&!st.busy){loadASR(p=>{const m=$("#mstate");if(m&&!st.live&&!st.busy&&!st.msg)m.textContent=`AI 채점 준비 중 ${p}% (처음 한 번만 받아요)`})
      .then(()=>{const m=$("#mstate");if(m&&!st.live&&!st.busy&&!st.msg)m.textContent=st.final?"다시 하려면 마이크를 누르세요":"마이크를 누르고 문장을 말하세요"}).catch(()=>{})}
    const meter=l=>{const bars=document.querySelectorAll("#eq i");const v=Math.min(1,l/2.5);
      bars.forEach((b,k)=>{b.style.height=(6+v*16*(0.6+0.4*Math.abs(Math.sin(Date.now()/120+k))))+"px"})};
    const liveRender=r=>{st.res=r;const box=$("#liveWords");if(!box)return;box.className="words";
      box.innerHTML=r.words.map((w,k)=>`<span class="${r.marks[k]==="miss"?"wait":r.marks[k]}">${esc(w)}</span>`).join("");
      const h=$("#heard");if(h)h.textContent=r.heard?"인식: “"+r.heard+"”":""};
    $("#micB").onclick=()=>{
      if(st.busy)return;
      if(st.live){if(ai&&curRec){curRec.finish();return}stopListening();st.live=0;st.msg="";render();return}
      st.final=0;st.msg="";st.res=null;
      listen(en,{
        onState:(s,p)=>{
          if(s==="starting"){st.live=1;st.busy=0;st.msg="마이크 준비 중…";render();return}
          if(s==="listening"){st.live=1;st.busy=0;st.msg=ai?"듣고 있어요. 말이 끝나면 자동으로 채점해요":"듣고 있어요. 지금 말하세요!";
            const m=$("#mstate");if(m)m.textContent=st.msg;const b=$("#micB");if(b)b.classList.add("live");return}
          const msg=s==="loading"?`AI 채점 준비 중 ${p!=null?p:asrPct}% (처음 한 번만 받아요)`:"채점 중…";
          if(!st.busy||st.live){st.live=0;st.busy=1;st.msg=msg;render()}else{st.msg=msg;const m=$("#mstate");if(m)m.textContent=msg}},
        onLevel:meter,
        onLive:r=>liveRender(r),
        onDone:r=>{st.live=0;st.busy=0;st.final=1;st.res=r;st.msg="";if(!st.counted){st.counted=1;award("speak",r.pct>=70)}render()},
        onError:m=>{st.live=0;st.busy=0;st.msg=m;render()}})};
    setCTA(st.final?`<button class="btn ghost" id="again">${ico(I.redo)}다시</button><button class="btn primary" id="go">계속하기</button>`
      :`<button class="btn ghost" id="skip">건너뛰기</button>`);
    if($("#again"))$("#again").onclick=()=>$("#micB").click();
    if($("#go"))$("#go").onclick=next;
    if($("#skip"))$("#skip").onclick=()=>{if(!st.counted){st.counted=1;dayLog().shadowing++;save()}next()}}
};
function gradeOf(p){return p>=90?["Perfect! 완벽해요","var(--good)","원어민이 바로 알아듣는 발음이에요."]
  :p>=75?["Great! 잘했어요","var(--good)","주황색 단어만 조금 더 또렷하게 말해 보세요."]
  :p>=55?["Good! 좋아요","var(--warn)","빨간 단어를 천천히 듣기로 다시 들어 보세요."]
  :["다시 해 볼까요?","var(--bad)","천천히 듣고, 한 단어씩 또박또박 따라 해 보세요."]}

function modeTile(k,wide){const K=KINDS[k];return `<button class="mode ${K.cls} ${wide?"wide":""}" data-mode="${k}"><span class="ic">${ico(K.icon)}</span><span style="display:grid;gap:2px"><h3>${K.name}</h3><p>${K.desc}</p></span>${wide?ico(I.arrow):""}</button>`}
views.practice=()=>`<div class="homeview" style="display:grid;gap:16px">
  <header class="top"><h1><small>원하는 것만 골라서</small>연습하기</h1></header>

  <div class="modes">${modeTile("speak",true)}${modeTile("word")}${modeTile("listen")}${modeTile("write")}${modeTile("gram")}</div></div>`;

  return `<div class="homeview" style="display:grid;gap:16px">

  <section class="card set">
    ${audioOK?`<label class="switch" for="recT"><span><b>원어민 스타일 음성</b><small>사람처럼 자연스러운 AI 음성으로 미리 만든 소리예요. 끄면 기기에 깔린 음성으로 읽어요.</small></span><input type="checkbox" id="recT" ${S.rec!==false?"checked":""}></label>`:""}
    <label for="voiceSel">${audioOK?"기기 음성 (녹음이 없는 단어용)":"발음 음성"}<select id="voiceSel">${voices.length?voices.map(o=>`<option value="${esc(o.name)}" ${v&&o.name===v.name?"selected":""}>${esc(o.name.replace(/Microsoft |Google /,""))} (${o.lang})</option>`).join(""):"<option>영어 음성 없음</option>"}</select></label>
    <label for="rateSel">말하기 속도 <span id="rateVal" class="muted">${rateLabel()}</span><input type="range" id="rateSel" min="0.5" max="1.1" step="0.05" value="${S.rate}"></label>
    <button class="btn ghost" id="testV">${ico(I.play)}"Nice to meet you." 들어보기</button>
  </section>
  <section class="card set">
    <label for="asrSel">발음 채점 방식<select id="asrSel">
      <option value="auto" ${(S.asr||"auto")==="auto"?"selected":""}>자동 (아이폰은 AI, PC는 빠른 인식)</option>
      <option value="ai" ${S.asr==="ai"?"selected":""}>AI 인식: 안정적, 처음 한 번 약 41MB 받기</option>
      <option value="fast" ${S.asr==="fast"?"selected":""}>빠른 인식: 말하는 동안 실시간 표시</option></select></label>
    <p class="muted" style="font-size:13px">지금 쓰는 방식: <b>${useAI()?"AI 인식":"빠른 인식"}</b>${useAI()?(asrReady?" · 준비 완료":" · 처음 말하기 할 때 내려받아요"):""}. 아이폰 홈 화면 앱에서 빠른 인식은 두 번째 문장부터 멈출 수 있어요.</p>
  </section>
  <section class="card"><span class="label">아이폰에 앱처럼 설치하기</span><ol class="how"><li>Safari로 앱 주소 열기</li><li>공유 버튼 → <b>홈 화면에 추가</b></li><li>처음 말하기 할 때 마이크·음성 인식 <b>허용</b></li></ol></section>
  <section class="card set"><span class="label">학습 기록</span>
    ${S._confirmReset?`<p>단어 암기 진도, 연속 기록, 경험치가 모두 지워져요. 되돌릴 수 없어요.</p><div style="display:flex;gap:10px"><button class="btn ghost" id="rsNo" style="flex:1">취소</button><button class="btn" id="rsYes" style="flex:1;background:var(--bad);color:var(--surface)">모두 지우기</button></div>`
    :`<button class="btn ghost" id="rsAsk">기록 초기화</button>`}</section></div>`};

function bindHome(){const s=$("#startL");if(s)s.onclick=()=>startSession("lesson");
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>startSession("practice",b.dataset.mode));
  document.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>{S.topic=b.dataset.topic;save();render()})}
function bindSettings(){const sel=$("#voiceSel");sel.onchange=()=>{S.voice=sel.value;save()};
  const r=$("#rateSel");r.oninput=()=>{S.rate=+r.value;$("#rateVal").textContent=rateLabel();save()};
  const t=$("#recT");if(t)t.onchange=()=>{S.rec=t.checked;save();render()};
  const a=$("#asrSel");a.onchange=()=>{S.asr=a.value;save();render()};
  $("#testV").onclick=()=>speak("Nice to meet you.");
  if($("#rsAsk"))$("#rsAsk").onclick=()=>{S._confirmReset=1;render()};
  if($("#rsNo"))$("#rsNo").onclick=()=>{delete S._confirmReset;render()};
  if($("#rsYes"))$("#rsYes").onclick=()=>{S={srs:{},log:{},voice:S.voice,rate:S.rate,topic:"전체",xp:0};save();toast("기록을 지웠어요");render()}}

function sessionView(){
  if(cur.finished){const n=cur.items.length;return `<div class="finish">
    <div class="medal">${ico(I.trophy)}</div><h2>${cur.mode==="lesson"?"오늘 학습 완료!":"연습 완료!"}</h2>
    <p class="muted">${streak()}일 연속 학습 중이에요. 내일도 만나요!</p>
    <div class="stats3"><div class="stat"><b>${Math.round(cur.correct/n*100)}%</b><span>정답률</span></div><div class="stat"><b style="color:var(--warn)">+${cur.xp}</b><span>XP</span></div><div class="stat"><b>${n}</b><span>문제</span></div></div></div>`}
  const it=cur.items[cur.i];
  return `<div class="sbar"><button class="iconbtn" id="quit" aria-label="그만하기">${ico(I.x)}</button><div class="prog"><i style="width:${cur.i/cur.items.length*100}%"></i></div><span class="xpchip">${cur.i+1}/${cur.items.length}</span></div>
  <div class="stage">${EX[it.type].html(it,cur.st)}</div>`}

/* ================= ROUTER ================= */
function route(){const h=location.hash.slice(1);if(h==="session")return cur?"session":"home";if(h==="speak")return "speak";return views[h]?h:"home"}
function render(){let r=route();
  if(r==="speak"){startSession("practice","speak");return}
  const app=$("#app");
  $("#nav").hidden=r==="session";app.classList.toggle("in-session",r==="session");
  document.querySelectorAll(".nav a").forEach(a=>a.setAttribute("aria-current",a.dataset.r===r?"page":"false"));
  if(r!=="session"){setCTA(null);hideSheet();app.innerHTML=views[r]();if(r==="settings")bindSettings();else bindHome();return}
  app.innerHTML=sessionView();
  if(cur.finished){setCTA(`<button class="btn primary" id="doneB">확인</button>`);$("#doneB").onclick=()=>{endSession();location.hash="home"};confetti();return}
  $("#quit").onclick=()=>{endSession();location.hash="home"};
  const it=cur.items[cur.i];EX[it.type].bind(it,cur.st)}
window.addEventListener("hashchange",()=>{if(location.hash!=="#session"&&cur){endSession()}render();window.scrollTo(0,0)});

/* confetti */
function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const c=$("#confetti");c.hidden=false;const x=c.getContext("2d");
  const W=c.width=innerWidth*devicePixelRatio,H=c.height=innerHeight*devicePixelRatio;const cols=["#3352F5","#FFD54A","#12A066","#EC5B37","#7446DB"];
  const ps=Array.from({length:120},()=>({x:W/2,y:H*.35,vx:(Math.random()-.5)*W*.03,vy:-Math.random()*H*.025-H*.005,r:Math.random()*6+4,c:pick(cols),a:Math.random()*6}));
  let f=0;(function tick(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=H*.0008;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2*devicePixelRatio,p.r*devicePixelRatio);x.restore()});
    if(++f<150)requestAnimationFrame(tick);else{c.hidden=true}})()}

render();
</script>
